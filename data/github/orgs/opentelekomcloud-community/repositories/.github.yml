---
.github:
  default_branch: main
  description: Meta description of the organization
  homepage: null
  # Holds the organization community health files, so it must stay writable.
  archived: false
  has_issues: true
  has_projects: false
  has_wiki: false
  delete_branch_on_merge: true
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  teams:
    - slug: "eco"
      permission: "push"
