[tox]
minversion = 3.1
envlist = py36,py37,pep8
skipsdist = True
ignore_basepython_conflict = True

[testenv]
basepython = python3
install_command = pip install {opts} {packages}
deps = -r{toxinidir}/test-requirements.txt

[testenv:linters]
usedevelop = True
install_command = pip install {opts} {packages}
# The validator only performs its GitHub visibility check when a token is
# available; without one it silently limits itself to the offline checks.
passenv = GITHUB_TOKEN
deps =
    -r{toxinidir}/linters-requirements.txt
commands =
    flake8 {posargs}
    yamllint -s -f parsable .
    python3 {toxinidir}/tools/validate_repository_data.py --root {toxinidir}

[flake8]
ignore = E501
show-source = True
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build,ansible_collections
